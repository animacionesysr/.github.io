<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a; /* Cambiado a oscuro para que el texto blanco sea visible */
            
            /* Cambios clave para congelar y centrar */
            margin: 0;
            height: 100vh;             /* Usa el 100% de la altura de la pantalla */
            display: flex;
            flex-direction: column;    /* Alinea los elementos uno abajo del otro */
            justify-content: center;   /* Centrado vertical exacto (Cambiable) */
            align-items: center;       /* Centrado horizontal exacto */
            overflow: hidden;          /* Bloquea las barras de scroll */
        }
        h1 {
            color: #D4AF37;            /* Color dorado */
            margin: 10px 0;            /* Controla el espacio arriba/abajo del título */
        }
        p {
            color: #ffffff;            /* Corregido: agregado el '#' faltante */
            font-size: 18px;
            margin: 10px 0;            /* Controla el espacio arriba/abajo del párrafo */
        }
    </style>
</head>
<body>
    <h1>¡Hola Binevenido!</h1>
    <p>En esta pagina encontraras todo lo relacionado con el tridente de las almas.</p>
</body>
</html>

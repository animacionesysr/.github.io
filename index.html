<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Fondo Completo</title>
    <style>
        /* Restablece los márgenes del navegador */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /* Configura la imagen de fondo */
        .fondo-completo {
            /* Reemplaza la URL por la ruta de tu imagen */
            background-image: url('render 5.png'); 
            height: 100vh; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-size: cover; 
            background-attachment: fixed; 

            /* --- Nuevas propiedades para centrar abajo --- */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Empuja el contenido al fondo */
            align-items: center;       /* Centra el contenido horizontalmente */
        }

        /* Contenedor del contenido en la parte inferior */
        .contenido-abajo {
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            
            /* Margen inferior para que el texto no toque el borde de la pantalla */
            margin-bottom: 40px; 
            
            /* Limita el ancho para que el texto no se estire demasiado en pantallas grandes */
            max-width: 80%; 
        }
    </style>
</head>
<body>

    <!-- Contenedor principal con el fondo -->
    <div class="fondo-completo">
        
        <!-- El contenido ahora se alineará abajo automáticamente -->
        <div class="contenido-abajo">
            <h1>¡Hola, Mundo!</h1>
            <p>Este texto se mantiene centrado en la parte inferior de la pantalla.</p>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio YSRComics - Clon Editable</title>
    <style>
        /* --- ESTILOS GENERALES (Estilo Cómic) --- */
        :root {
            --yellow: #FBE15A;
            --cyan: #51C2C4;
            --pink: #FF4E88;
            --dark: #111111;
            --white: #FFFFFF;
        }

        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--cyan);
            /* Fondo de rayos estilo cómic */
            background-image: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.15) 0deg 15deg, transparent 15deg 30deg);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* --- BARRA DE NAVEGACIÓN --- */
        header {
            background-color: var(--yellow);
            border-bottom: 5px solid var(--dark);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: var(--dark);
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s;
        }

        .nav-btn:hover {
            transform: scale(1.1);
            color: var(--pink);
        }

        .cta-nav {
            background-color: var(--pink);
            font-family: 'Bangers', cursive;
            color: var(--white);
            padding: 10px 20px;
            border: 3px solid var(--dark);
            border-radius: 8px;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--dark);
            transition: all 0.2s;
        }

        .cta-nav:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--dark);
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .hero-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        /* Columna Izquierda */
        .hero-text-side {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tag-limited {
            align-self: flex-start;
            background-color: var(--white);
            border: 3px solid var(--dark);
            padding: 5px 15px;
            font-family: 'Bangers', cursive;
            font-size: 1rem;
            letter-spacing: 1px;
            box-shadow: 3px 3px 0px var(--dark);
            cursor: pointer;
        }

        .main-title {
            font-family: 'Bangers', cursive;
            font-size: 5.5rem;
            line-height: 0.9;
            color: var(--white);
            -webkit-text-stroke: 3px var(--dark);
            text-shadow: 5px 5px 0px var(--dark);
            cursor: pointer;
            text-transform: uppercase;
        }

        .description {
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            border-radius: 4px;
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .btn-action {
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            padding: 12px 30px;
            border: 4px solid var(--dark);
            cursor: pointer;
            box-shadow: 5px 5px 0px var(--dark);
            transition: all 0.2s;
        }

        .btn-pink { background-color: var(--pink); color: var(--white); }
        .btn-white { background-color: var(--white); color: var(--dark); }

        .btn-action:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px var(--dark);
        }

        /* Columna Derecha (Arte del Cómic) */
        .hero-image-side {
            display: flex;
            justify-content: center;
        }

        .comic-frame-outer {
            background-color: var(--white);
            border: 6px solid var(--dark);
            padding: 20px;
            box-shadow: 15px 15px 0px var(--dark);
            transform: rotate(2deg);
            width: 100%;
            max-width: 580px;
            transition: transform 0.3s;
        }

        .comic-frame-outer:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .comic-header-title {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 4px dashed var(--dark);
            padding-bottom: 10px;
            cursor: pointer;
        }

        /* Contenedor de Imagen Proporción 1280x720 (16:9) */
        .comic-image-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: 5px solid var(--dark);
            background-color: #222;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .comic-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- MODAL / VENTANA EMERGENTE DE EDICIÓN --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            background-color: var(--yellow);
            border: 5px solid var(--dark);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 10px 10px 0px var(--dark);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-box h3 {
            font-family: 'Bangers', cursive;
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .modal-box textarea, .modal-box input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 3px solid var(--dark);
            margin-bottom: 15px;
            font-family: inherit;
        }

        .modal-box textarea {
            height: 120px;
            resize: vertical;
        }

        .modal-box .image-hint {
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            padding: 8px 20px;
            border: 3px solid var(--dark);
            cursor: pointer;
        }

        .btn-save { background-color: var(--pink); color: var(--white); }
        .btn-cancel { background-color: var(--white); color: var(--dark); }

        /* Responsivo básico */
        @media (max-width: 900px) {
            .hero-container { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 15px; }
            .main-title { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header>
        <div class="logo" id="element-logo" onclick="openModal('element-logo', 'text')">Studio YSRComics</div>
        <nav>
            <button class="nav-btn" id="btn-1" onclick="openModal('btn-1', 'text')">Capitulo</button>
            <button class="nav-btn" id="btn-2" onclick="openModal('btn-2', 'text')">Servicios</button>
            <button class="nav-btn" id="btn-3" onclick="openModal('btn-3', 'text')">Equipo</button>
            <button class="nav-btn" id="btn-4" onclick="openModal('btn-4', 'text')">Contacto</button>
            <button class="cta-nav" id="btn-5" onclick="openModal('btn-5', 'text')">¡Pide tu Cómic!</button>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="hero-container">
        <!-- LADO IZQUIERDO: TEXTOS -->
        <div class="hero-text-side">
            <div class="tag-limited" id="element-tag" onclick="openModal('element-tag', 'text')">
                NÚMERO #01 · EDICIÓN LIMITADA
            </div>
            <h1 class="main-title" id="element-title" onclick="openModal('element-title', 'text')">
                Ideas que<br>explotan
            </h1>
            <p class="description" id="element-desc" onclick="openModal('element-desc', 'text')">

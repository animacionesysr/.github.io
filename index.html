<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Kapow — Estudio creativo estilo cómic</title>
  <meta name="description" content="Estudio creativo con estética de cómic: identidad visual, webs animadas e ilustración con trazo grueso y color plano." />
  <meta property="og:title" content="Studio Kapow — Estudio creativo estilo cómic" />
  <meta property="og:description" content="Marcas dibujadas como portadas de cómic: identidad, web e ilustración." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    /* ============ VARIABLES EDITABLES ============ */
    :root {
      --ink: #1a1a1a;
      --paper: #f8f5e6;
      --pow: #ffde4d;
      --zap: #4ecdc4;
      --boom: #ff4d6d;
      --font-comic: 'Bangers', cursive;
      --font-body: 'Comic Neue', cursive;
      --border: 4px solid var(--ink);
    }

    /* ============ RESET ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.4;
    }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    /* ============ UTILIDADES CÓMIC ============ */
    .font-comic { font-family: var(--font-comic); letter-spacing: 0.02em; }
    .panel {
      border: var(--border);
      box-shadow: 8px 8px 0 var(--ink);
      transition: transform 0.15s ease;
    }
    .panel:hover { transform: translateY(-4px); }
    .panel-sm {
      border: var(--border);
      box-shadow: 4px 4px 0 var(--ink);
      border-radius: 8px;
    }
    .ink-stroke {
      -webkit-text-stroke: 2px var(--ink);
      text-shadow: 3px 3px 0 var(--ink);
    }
    .pop-in {
      transform: rotate(-3deg);
      border-radius: 50% 50% 50% 10%;
    }
    .pop-in::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 20px;
      width: 0;
      height: 0;
      border: 12px solid transparent;
      border-top-color: var(--ink);
      border-left: 0;
      transform: rotate(-15deg);
    }
    .halftone {
      background-image: radial-gradient(circle, var(--ink) 1px, transparent 1px);
      background-size: 8px 8px;
      opacity: 0.08;
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .rays {
      background: repeating-conic-gradient(
        from 0deg,
        var(--paper) 0deg 10deg,
        transparent 10deg 20deg
      );
      opacity: 0.25;
    }

    /* ============ CONTENEDOR ============ */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* ============ NAV ============ */
    .nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--pow);
      border-bottom: var(--border);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1rem;
    }
    .nav-links {
      display: flex; /* Cambiado a flex para visualización básica */
      gap: 1.5rem;
      list-style: none;
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
      font-family: var(--font-comic);
    }
    .nav-links a { cursor: pointer; }
    .nav-links a:hover { color: var(--boom); }
    .nav-cta {
      background: var(--boom);
      color: var(--paper);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: var(--font-comic);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .nav-cta:hover { transform: translateY(-2px); }

    /* ============ HERO ============ */
    .hero {
      position: relative;
      overflow: hidden;
      background: var(--zap);
      border-bottom: var(--border);
      padding: 4rem 0;
    }
    .hero-grid {
      display: grid;
      gap: 2rem;
      align-items: center;
    }
    .hero-kicker {
      display: inline-block;
      background: var(--paper);
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      border: var(--border);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .hero-title {
      font-size: 3.5rem;
      line-height: 0.95;
      margin-top: 1.25rem;
    }
    .hero-title span { display: block; }
    .hero-title .highlight { color: var(--pow); }
    .hero-text { max-width: 28rem; margin-top: 1.25rem; font-size: 1.125rem; font-weight: 700; }
    .hero-actions { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 1rem; }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      font-family: var(--font-comic);
      font-size: 1.5rem;
      border: var(--border);
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform 0.15s ease;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-4px); }
    .btn-primary { background: var(--boom); color: var(--paper); }
    .btn-secondary { background: var(--paper); color: var(--ink); }

    .hero-image-wrap { position: relative; }
    .hero-image { transform: rotate(-2deg); background: var(--paper); padding: 0.75rem; }
    .hero-bubble {
      position: absolute;
      bottom: -1.5rem;
      left: -1rem;
      max-width: 15rem;
      background: var(--paper);
      padding: 0.75rem 1rem;
      font-weight: 900;
      border: var(--border);
      box-shadow: 4px 4px 0 var(--ink);
      z-index: 5;
    }

    /* ============ ONOMATOPEYAS ============ */
    .onomatopeyas {
      background: var(--ink);
      border-bottom: var(--border);
      padding: 0.75rem 0;
      overflow: hidden;
    }
    .onomatopeyas-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }
    .onomatopeyas span { font-family: var(--font-comic); font-size: 1.75rem; }
    .onomatopeyas span:nth-child(odd) { color: var(--boom); }
    .onomatopeyas span:nth-child(even) { color: var(--pow); }

    /* ============ SECCIONES ============ */
    .section { padding: 4rem 0; }
    .section-title { font-size: 2.75rem; margin-bottom: 2rem; }

    /* Servicios */
    .services-grid { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    .service-card {
      position: relative;
      background: var(--paper);
      padding: 1.5rem;
      border: var(--border);
      box-shadow: 8px 8px 0 var(--ink);
      cursor: pointer;
    }
    .service-card .sonido {
      position: absolute;
      top: -1.5rem;
      left: 1rem;
      font-size: 2rem;
      color: var(--pow);
      -webkit-text-stroke: 1.5px var(--ink);
    }
    .service-card h3 { font-size: 1.75rem; margin-top: 0.5rem; }
    .service-card p { margin-top: 0.5rem; font-weight: 700; }

    /* ============ NUEVO SISTEMA DE PESTAÑAS EMERGENTES (MODALES CÓMIC) ============ */
    .comic-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 26, 0.85);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .comic-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .comic-modal {
      background: var(--paper);
      border: var(--border);
      box-shadow: 12px 12px 0 var(--ink);
      width: 100%;
      max-width: 900px; /* Tamaño grande */
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      padding: 3rem 2rem 2rem 2rem;
      transform: scale(0.9) rotate(-1deg);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .comic-overlay.active .comic-modal {
      transform: scale(1) rotate(0deg);
    }
    .modal-close-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--boom);
      color: var(--paper);
      font-family: var(--font-comic);
      font-size: 1.5rem;
      padding: 0.25rem 1rem;
      border: var(--border);
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      text-transform: uppercase;
    }
    .modal-close-btn:hover {
      transform: translateY(-2px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .modal-content-area {
      font-weight: 700;
    }
    .modal-content-area h2 {
      font-size: 3rem;
      color: var(--ink);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner container">
      <div class="font-comic ink-stroke" style="font-size: 2rem; color: var(--paper);">STUDIO KAPOW</div>
      <ul class="nav-links">
        <li><a onclick="openModal('capitulo')">Capítulo</a></li>
        <li><a onclick="openModal('servicios')">Servicios</a></li>
        <li><a onclick="openModal('equipo')">Equipo</a></li>
        <li><a onclick="openModal('contacto')">Contacto</a></li>
      </ul>
      <div class="nav-cta" onclick="openModal('contacto')">¡HABLAMOS!</div>
    </div>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <div class="halftone"></div>
    <div class="hero-grid container">
      <div>
        <span class="hero-kicker">Estudio Creativo</span>
        <h1 class="hero-title font-comic ink-stroke" style="color: var(--paper);">
          <span>CREAMOS MARCAS</span>
          <span class="highlight">CON PODER</span>
          <span>VISUAL.</span>
        </h1>
        <p class="hero-text">Damos vida a tus proyectos con un estilo cómic rompedor, trazos contundentes y colores vibrantes.</p>

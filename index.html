<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz Moderna con Botones</title>
    <!-- Fuentes e Iconos -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a; 
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 150vh; /* Se añade altura extra para poder deslizar y probar el efecto */
        }

        .header {
            text-align: center;
            width: 100%;
            padding: 0;
        }

        /* CONFIGURACIÓN PARA QUE LA IMAGEN NO SE REPITA NI SE MUEVA AL DESLIZAR */
        .titulo-imagen {
            width: 100%;
            height: 450px; /* Altura del contenedor de tu título */
            margin: 0 auto;
            
            /* Carga de la imagen */
            background-image: url('render 5.png');
            
            /* SOLUCIÓN: cover expande la imagen, no-repeat evita duplicados y fixed la congela al deslizar */
            background-size: cover; 
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed; /* <- Esto congela la imagen al hacer scroll */

            text-indent: -9999px;
            overflow: hidden;
        }

        /* Contenedor de botones flotantes sobre la interfaz */
        .contenedor-botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px; 
            max-width: 1200px;
            padding: 40px 20px;
            margin-top: -30px; /* Eleva un poco los botones sobre la imagen para un look moderno */
            z-index: 10;
        }

        /* Estilo base de los botones */
        .btn-moderno {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            padding: 14px 28px;
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-moderno:hover {
            transform: translateY(-3px); 
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
            filter: brightness(1.2); 
        }

        /* Personalización de colores y tipografías */
        .btn-inicio { background-color: #00bcd4; color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 16px; }
        .btn-proyectos { background-color: #6200ea; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; }
        .btn-galeria { background-color: #00b0ff; color: #ffffff; font-family: 'Roboto', sans-serif; font-size: 17px; }
        .btn-renderizar { background-color: #ff3d00; color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 16px; letter-spacing: 1px; }
        .btn-ajustes { background-color: #37474f; color: #eceff1; font-family: 'Roboto', sans-serif; font-size: 14px; }
        .btn-descargar { background-color: #00e676; color: #0f172a; font-family: 'Montserrat', sans-serif; font-size: 16px; }
        .btn-contacto { background-color: #ff007f; color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 18px; }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="titulo-imagen">Título de mi Render 5</h1>
    </header>

    <main class="contenedor-botones">
        <button class="btn-moderno btn-inicio"><i class="fa-solid fa-house"></i> Inicio</button>
        <button class="btn-moderno btn-proyectos"><i class="fa-solid fa-folder-open"></i> Proyectos</button>
        <button class="btn-moderno btn-galeria"><i class="fa-solid fa-images"></i> Galería</button>
        <button class="btn-moderno btn-renderizar"><i class="fa-solid fa-cube"></i> Renderizar</button>
        <button class="btn-moderno btn-ajustes"><i class="fa-solid fa-gear"></i> Ajustes</button>
        <button class="btn-moderno btn-descargar"><i class="fa-solid fa-download"></i> Descargar</button>
        <button class="btn-moderno btn-contacto"><i class="fa-solid fa-envelope"></i> Contacto</button>
    </main>

</body>
</html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz Moderna sin Repeticiones</title>
    <!-- Fuentes e Iconos Corregidos -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        /* Bloqueamos cualquier repetición heredada en las etiquetas principales */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh; /* Altura exacta de la pantalla, sin scroll artificial */
            background-color: #0f172a !important; 
            background-image: none !important; /* Destruye cualquier fondo duplicado */
            background-repeat: no-repeat !important;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; /* Congela la pantalla para evitar que se deslice infinitamente */
        }

        /* ESTRUCTURA CONTENEDORA ÚNICA: Controla que nada se duplique */
        .pantalla-principal {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .header {
            text-align: center;
            width: 100%;
            padding: 0;
            margin: 0;
        }

        /* Tu imagen de título con candados anti-duplicación */
        .titulo-imagen {
            width: 100%;
            height: 400px; 
            margin: 0;
            background-image: url('render%205.png') !important;
            background-size: contain !important; /* Cambia a 'cover' si prefieres que estire */
            background-repeat: no-repeat !important; /* Prohibido repetirse */
            background-position: center top !important;
            text-indent: -9999px;
            overflow: hidden;
        }

        /* BARRA DE MENÚ ESTÁTICA (Aparece una sola vez y no se mueve) */
        .barra-navegacion {
            width: 100%;
            background-color: #1e293b; 
            display: flex;
            justify-content: center;
            padding: 20px 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin: 0;
        }

        /* Contenedor interno de los 7 botones */
        .contenedor-botones {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center;
            gap: 15px; 
            max-width: 1200px;
            width: 90%;
        }

        /* Estilo base de los botones modernos */
        .btn-moderno {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            padding: 14px 24px;
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-moderno:hover {
            transform: translateY(-3px); 
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
            filter: brightness(1.2); 
        }

        /* Estilos individuales de color y letra para cada botón */
        .btn-inicio { background-color: #00bcd4; color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 16px; }
        .btn-proyectos { background-color: #6200ea; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700; }
        .btn-galeria { background-color: #00b0ff; color: #ffffff; font-family: 'Roboto', sans-serif; font-size: 17px; }
        .btn-renderizar { background-color: #ff3d00; color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 16px; letter-spacing: 1px; }
        .btn-ajustes { background-color: #37474f; color: #eceff1; font-family: 'Roboto', sans-serif; font-size: 14px; }
        .btn-descargar { background-color: #00e676; color: #0f172a; font-family: 'Montserrat', sans-serif; font-size: 16px; }
        .btn-contacto { background-color: #ff007f; color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 18px; }
    </style>
</head>
<body>

    <!-- El contenedor 'pantalla-principal' aísla todo para evitar duplicados en el navegador -->
    <div class="pantalla-principal">

        <!-- Sección 1: Tu Imagen de Título -->
        <header class="header">
            <h1 class="titulo-imagen">Título de mi Render 5</h1>
        </header>

        <!-- Sección 2: Barra Única de Botones -->
        <nav class="barra-navegacion">
            <div class="contenedor-botones">
                <button class="btn-moderno btn-inicio"><i class="fa-solid fa-house"></i> Inicio</button>
                <button class="btn-moderno btn-proyectos"><i class="fa-solid fa-folder-open"></i> Proyectos</button>
                <button class="btn-moderno btn-galeria"><i class="fa-solid fa-images"></i> Galería</button>
                <button class="btn-moderno btn-renderizar"><i class="fa-solid fa-cube"></i> Renderizar</button>
                <button class="btn-moderno btn-ajustes"><i class="fa-solid fa-gear"></i> Ajustes</button>
                <button class="btn-moderno btn-descargar"><i class="fa-solid fa-download"></i> Descargar</button>
                <button class="btn-moderno btn-contacto"><i class="fa-solid fa-envelope"></i> Contacto</button>
            </div>
        </nav>

    </div>

</body>
</html>

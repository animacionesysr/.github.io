<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Logo de Título</title>
    <style>
        /* Contenedor del encabezado */
        .header {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
        }

        /* Estilo del título principal */
        .titulo-imagen {
            /* 1. Ajusta el tamaño donde se mostrará la imagen */
            width: 300px;
            height: 100px;
            margin: 0 auto;

            /* 2. Carga tu imagen de título (reemplaza la URL por la tuya) */
            background-image: url('render 5.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;

            /* 3. Oculta el texto de forma accesible */
            text-indent: -9999px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header class="header">
        <!-- El texto está escrito aquí por accesibilidad y SEO, pero el CSS lo reemplaza por la imagen -->
        <h1 class="titulo-imagen">Nombre de Mi Empresa o Sitio Web</h1>
    </header>

</body>
</html>

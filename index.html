<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Cómic</title>
    <!-- Fuente alternativa estilo cómic desde Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Estilos Generales y Contenedor Principal (Ventana Estrecha) */
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        /* Ventana no tan ancha (Simulación de contenedor/header) */
        .comic-navbar {
            max-width: 950px; 
            margin: 0 auto;
            background-color: #fff;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        /* Configuración de Fuentes Cómic */
        .comic-font {
            /* Usa Badaboom BB si está en el sistema; si no, usa Bangers */
            font-family: 'Badaboom BB', 'Bangers', cursive;
            letter-spacing: 2px;
        }

        /* Parte Izquierda: Título centrado verticalmente */
        .left-section {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .main-title {
            font-size: 2.5rem;
            color: #000;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #ffcc00;
        }

        /* Parte Central: Subtítulos */
        .center-section {
            flex: 2;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .subtitle {
            font-size: 1.4rem;
            color: #333;
            text-decoration: none;
            text-transform: uppercase;
            transition: transform 0.2s, color 0.2s;
        }

        .subtitle:hover {
            color: #ffcc00;
            transform: scale(1.1) rotate(-2deg);
        }

        /* Parte Derecha: Botón Recuadro Rojo */
        .right-section {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        .comic-button {
            background-color: #ff0000;
            color: #fff;
            border: 4px solid #000;
            padding: 10px 20px;
            font-size: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .comic-button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }

        .comic-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }
    </style>
</head>
<body>

    <!-- Contenedor con la ventana de ancho controlado -->
    <nav class="comic-navbar">
        
        <!-- Izquierda: Título principal -->
        <div class="left-section">
            <h1 class="main-title comic-font">Mi Título</h1>
        </div>

        <!-- Centro: Los 4 subtítulos solicitados -->
        <div class="center-section">
            <a href="#" class="subtitle comic-font">Capítulo</a>
            <a href="#" class="subtitle comic-font">Servicios</a>
            <a href="#" class="subtitle comic-font">Equipo</a>
            <a href="#" class="subtitle comic-font">Contacto</a>
        </div>

        <!-- Derecha: Botón de recuadro rojo estilo cómic -->
        <div class="right-section">
            <button class="comic-button comic-font">Pide tu cómic</button>
        </div>

    </nav>

</body>
</html>

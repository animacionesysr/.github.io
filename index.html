<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Kapow — Estudio creativo estilo cómic</title>
  <meta name="description" content="Estudio creativo con estética de cómic: identidad visual, webs animadas e ilustración con trazo grueso y color plano." />
  <meta property="og:title" content="Studio Kapow — Estudio creativo estilo cómic" />
  <meta property="og:description" content="Marcas dibujadas como portadas de cómic: identidad, web e ilustración." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ============ VARIABLES EDITABLES ============ */
    :root {
      --ink: #1a1a1a;
      --paper: #f8f5e6;
      --pow: #ffde4d;
      --zap: #4ecdc4;
      --boom: #ff4d6d;
      --font-comic: 'Bangers', cursive;
      --font-body: 'Comic Neue', cursive;
      --border: 4px solid var(--ink);
    }

    /* ============ RESET ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.4;
    }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    /* ============ UTILIDADES CÓMIC ============ */
    .font-comic { font-family: var(--font-comic); letter-spacing: 0.02em; }
    .panel {
      border: var(--border);
      box-shadow: 8px 8px 0 var(--ink);
      transition: transform 0.15s ease;
    }
    .panel:hover { transform: translateY(-4px); }
    .panel-sm {
      border: var(--border);
      box-shadow: 4px 4px 0 var(--ink);
      border-radius: 8px;
    }
    .ink-stroke {
      -webkit-text-stroke: 2px var(--ink);
      text-shadow: 3px 3px 0 var(--ink);
    }
    .pop-in {
      transform: rotate(-3deg);
      border-radius: 50% 50% 50% 10%;
    }
    .pop-in::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 20px;
      width: 0;
      height: 0;
      border: 12px solid transparent;
      border-top-color: var(--ink);
      border-left: 0;
      transform: rotate(-15deg);
    }
    .halftone {
      background-image: radial-gradient(circle, var(--ink) 1px, transparent 1px);
      background-size: 8px 8px;
      opacity: 0.08;
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .rays {
      background: repeating-conic-gradient(
        from 0deg,
        var(--paper) 0deg 10deg,
        transparent 10deg 20deg
      );
      opacity: 0.25;
    }

    /* ============ CONTENEDOR ============ */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* ============ NAV ============ */
    .nav {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--pow);
      border-bottom: var(--border);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1rem;
    }
    .nav-links {
      display: none;
      gap: 1.5rem;
      list-style: none;
      font-size: 0.875rem;
      font-weight: 900;
      text-transform: uppercase;
    }
    .nav-links a:hover { color: var(--boom); }
    .nav-cta {
      background: var(--boom);
      color: var(--paper);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-family: var(--font-comic);
      font-size: 1.1rem;
    }
    .nav-cta:hover { transform: translateY(-2px); }

    /* ============ HERO ============ */
    .hero {
      position: relative;
      overflow: hidden;
      background: var(--zap);
      border-bottom: var(--border);
      padding: 4rem 0;
    }
    .hero-grid {
      display: grid;
      gap: 2rem;
      align-items: center;
    }
    .hero-kicker {
      display: inline-block;
      background: var(--paper);
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      border: var(--border);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .hero-title {
      font-size: 3.5rem;
      line-height: 0.95;
      margin-top: 1.25rem;
    }
    .hero-title span { display: block; }
    .hero-title .highlight { color: var(--pow); }
    .hero-text { max-width: 28rem; margin-top: 1.25rem; font-size: 1.125rem; font-weight: 700; }
    .hero-actions { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 1rem; }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      font-family: var(--font-comic);
      font-size: 1.5rem;
      border: var(--border);
      box-shadow: 6px 6px 0 var(--ink);
      transition: transform 0.15s ease;
    }
    .btn:hover { transform: translateY(-4px); }
    .btn-primary { background: var(--boom); color: var(--paper); }
    .btn-secondary { background: var(--paper); color: var(--ink); }

    .hero-image-wrap {
      position: relative;
    }
    .hero-image {
      transform: rotate(-2deg);
      background: var(--paper);
      padding: 0.75rem;
    }
    .hero-bubble {
      position: absolute;
      bottom: -1.5rem;
      left: -1rem;
      max-width: 15rem;
      background: var(--paper);
      padding: 0.75rem 1rem;
      font-weight: 900;
      border: var(--border);
      box-shadow: 4px 4px 0 var(--ink);
      z-index: 5;
    }
    .hero-bubble::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 20px;
      width: 0;
      height: 0;
      border: 12px solid transparent;
      border-top-color: var(--ink);
      border-left: 0;
      transform: rotate(-15deg);
    }

    /* ============ ONOMATOPEYAS ============ */
    .onomatopeyas {
      background: var(--ink);
      border-bottom: var(--border);
      padding: 0.75rem 0;
      overflow: hidden;
    }
    .onomatopeyas-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }
    .onomatopeyas span {
      font-family: var(--font-comic);
      font-size: 1.75rem;
    }
    .onomatopeyas span:nth-child(odd) { color: var(--boom); }
    .onomatopeyas span:nth-child(even) { color: var(--pow); }

    /* ============ SECCIONES ============ */
    .section { padding: 4rem 0; }
    .section-title { font-size: 2.75rem; margin-bottom: 2rem; }

    /* Servicios */
    .services-grid {
      display: grid;
      gap: 2rem;
    }
    .service-card {
      position: relative;
      background: var(--paper);
      padding: 1.5rem;
      border: var(--border);
      box-shadow: 8px 8px 0 var(--ink);
    }
    .service-card .sonido {
      position: absolute;
      top: -1.5rem;
      left: 1rem;
      font-size: 2rem;
      color: var(--pow);
      -webkit-text-stroke: 1.5px var(--ink);
    }
    .service-card h3 { font-size: 1.75rem; margin-top: 0.5rem; }
    .service-card p { margin-top: 0.5rem; font-weight: 700; }

    /* Proceso */
    .process {
      background: var(--pow);
      border-top: var(--border);
      border-bottom: var(--border);
    }
    .process-grid {
      display: grid;
      gap: 1.5rem;
    }
    .process-card {
      background: var(--paper);
      padding: 1.25rem;
      border: var(--border);
      box-shadow: 8px 8px 0 var(--ink);
    }
    .process-card .num { font-size: 2.5rem; color: var(--boom); }
    .process-card h3 { font-size: 1.5rem; }
    .process-card p { font-size: 0.95rem; font-weight: 700; }

    /* Testimonios */
    .testimonials-grid {
      display: grid;
      gap: 2rem;
    }
    .testimonial {
      background: var(--zap);
      padding: 1.5rem;
      border: var(--border);
      box-shadow: 8px 8px 0 var(--ink);
    }
    .testimonial blockquote {
      font-family: var(--font-comic);
      font-size: 1.5rem;
      line-height: 1.2;
    }
    .testimonial figcaption {
      margin-top: 0.75rem;
      font-size: 0.875rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* Cierre */
    .cta-section {
      position: relative;
      overflow: hidden;
      background: var(--boom);
      border-top: var(--border);
      text-align: center;
      padding: 5rem 0;
    }
    .cta-section h2 {
      font-size: 3rem;
      color: var(--pow);
    }
    .cta-section p {
      max-width: 40rem;
      margin: 1rem auto 0;
      font-size: 1.125rem;
      font-weight: 900;
      color: var(--paper);
    }
    .cta-section .btn {
      margin-top: 2rem;
      background: var(--pow);
      color: var(--ink);
    }

    /* Footer */
    footer {
      background: var(--ink);
      color: var(--paper);
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 700;
      border-top: var(--border);
    }

    /* ============ RESPONSIVE ============ */
    @media (min-width: 768px) {
      .nav-links { display: flex; }
      .hero-grid { grid-template-columns: 1fr 1fr; }
      .hero-title { font-size: 5rem; }
      .hero-bubble { left: -2.5rem; }
      .services-grid { grid-template-columns: repeat(3, 1fr); }
      .process-grid { grid-template-columns: repeat(2, 1fr); }
      .testimonials-grid { grid-template-columns: repeat(2, 1fr); }
      .onomatopeyas span { font-size: 2.25rem; }
      .section-title { font-size: 3.5rem; }
      .cta-section h2 { font-size: 4rem; }
    }
    @media (min-width: 1024px) {
      .process-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
